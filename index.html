<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>changes an image</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container">
        <img id="CatImage" src="image.jpeg" alt="cat image">
        <br><br>
        <button onclick="imagechanger()"> Change Image</button>
    </div>
    
    <script>
        function imagechanger() {
            document.getElementById("CatImage") .src="imgchange.jpg"
        }
    </script>

</body>
</html>
